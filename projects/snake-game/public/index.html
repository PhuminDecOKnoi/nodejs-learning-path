<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Snake Game ตัวอย่างการพัฒนาเกมด้วย Node.js, Express 5 และ Canvas"
    />
    <title>Snake Game with Node.js</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-labelledby="game-title">
      <section class="game-card">
        <header class="game-header">
          <div>
            <p class="eyebrow">Node.js Learning Project</p>
            <h1 id="game-title">Snake Game</h1>
          </div>

          <div class="scoreboard" aria-live="polite">
            <span>คะแนน</span>
            <strong id="score-value">0</strong>
          </div>
        </header>

        <p class="instructions">
          ใช้ปุ่มลูกศรหรือ W A S D เพื่อบังคับงู กด Space เพื่อเริ่มใหม่หลังเกมจบ
        </p>

        <div class="canvas-wrapper">
          <canvas
            id="game-canvas"
            width="600"
            height="600"
            aria-label="พื้นที่เล่นเกมงู"
          ></canvas>
        </div>

        <div class="controls" aria-label="ปุ่มควบคุมสำหรับหน้าจอสัมผัส">
          <button type="button" data-direction="up" aria-label="ขึ้น">↑</button>
          <div class="controls-row">
            <button type="button" data-direction="left" aria-label="ซ้าย">←</button>
            <button type="button" data-direction="down" aria-label="ลง">↓</button>
            <button type="button" data-direction="right" aria-label="ขวา">→</button>
          </div>
        </div>

        <footer class="game-footer">
          <span id="status-message">กำลังเตรียมเกม...</span>
        </footer>
      </section>
    </main>

    <!-- โหลด JavaScript แบบ ES Module เพื่อแบ่งโค้ดเป็นหลายไฟล์อย่างเป็นระบบ -->
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
